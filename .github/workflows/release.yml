name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux CLI binaries
        working-directory: linux-cli
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          LDFLAGS="-X github.com/kvm404/phonecam/linux-cli/internal/cli.version=${VERSION}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" go build \
              -ldflags "${LDFLAGS}" \
              -o "phonecam-linux-${arch}" \
              ./cmd/phonecam
          done

      - name: Generate checksums
        working-directory: linux-cli
        run: |
          sha256sum phonecam-linux-amd64 phonecam-linux-arm64 > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            linux-cli/phonecam-linux-amd64
            linux-cli/phonecam-linux-arm64
            linux-cli/SHA256SUMS
